// Quake III Arena public multiplayer master-server configuration.
// This uses the native Quake III master protocol (UDP 27950), not GameSpy.
// Load from a dedicated server with: +exec quake3-masters.cfg
//
// OpenSpy's GameSpy master endpoint (master.openspy.net:27900) is not
// protocol-compatible with Quake III Arena and is intentionally not listed.

set dedicated "2"
set sv_master1 "master.quake3arena.com:27950"
set sv_master2 "master.ioquake3.org:27950"
set sv_master3 "master.maverickservers.com:27950"
set sv_master4 "master0.excessiveplus.net:27950"
set sv_master5 "dpmaster.deathmask.net:27950"
